[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamgate"
dynamic = ["version"]
description = "A pure-core Kafka data pipeline framework: conditional admission, reliable delivery, and one obvious consume-loop outlet via a typed handler."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wanguo Pang" }]
keywords = [
    "kafka",
    "pipeline",
    "ingestion",
    "backpressure",
    "dlq",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# 核心依赖绝对最轻（纯机制）：传输（aiokafka）、观测（loguru）、配置（pydantic）。
# I/O 策略实现收敛于 streamgate.contrib（随 wheel 发布、按 extras 携带依赖）；
# 核心层不得 import contrib（import-linter 分层契约强制）。
dependencies = [
    "aiokafka>=0.10",
    "loguru>=0.7",
    "pydantic>=2.5",
]

[project.optional-dependencies]
redis = ["redis>=5"]
sql = [
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.16",
    "aiosqlite>=0.19",
    "aioodbc>=0.5",
]
http = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/pwg-code/streamgate"
Repository = "https://github.com/pwg-code/streamgate"
Changelog = "https://github.com/pwg-code/streamgate/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/streamgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/streamgate"]

[dependency-groups]
dev = [
    # contrib 依赖经 extras 单一来源引入（lint/pyright 需要其类型可解析）；
    # 核心层对它们零依赖（import-linter 分层契约强制）
    "streamgate[redis,sql,http]",
    "import-linter>=2.0",
    "pyright>=1.1.380",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式收敛规则集（CI 确定性）：正确性（E4/E7/E9/F）+ import 排序（I）。
# 自愈式代码大量使用 except Exception 兜底并记录日志（BLE/S 系不适用）。
select = ["E4", "E7", "E9", "F", "I"]

[tool.importlinter]
root_packages = ["streamgate"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (higher layers may import lower layers; core never imports contrib)"
type = "layers"
layers = [
    "streamgate.contrib",
    "streamgate.ingest | streamgate.consumer",
    "streamgate.transport | streamgate.resilience",
    "streamgate.protocols | streamgate.config | streamgate.obs",
]

[tool.pyright]
pythonVersion = "3.10"
include = ["src/streamgate"]
typeCheckingMode = "basic"
