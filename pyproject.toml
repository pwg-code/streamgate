[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamgate"
dynamic = ["version"]
description = "A pure-core Kafka data pipeline framework: conditional admission, reliable delivery, pluggable sinks via typed hooks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wanguo Pang" }]
keywords = [
    "kafka",
    "pipeline",
    "ingestion",
    "backpressure",
    "dlq",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# 核心依赖绝对最轻（纯机制）：传输（aiokafka）、观测（loguru）、配置（pydantic）。
# 一切 I/O 策略实现（DB 落库、Redis 准入、HTTP 探针）不进 wheel：
# 可复制的示例代码见仓库 examples/（import-linter forbidden 契约强制）。
dependencies = [
    "aiokafka>=0.10",
    "loguru>=0.7",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/pwg-code/streamgate"
Repository = "https://github.com/pwg-code/streamgate"
Changelog = "https://github.com/pwg-code/streamgate/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/streamgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/streamgate"]

[dependency-groups]
dev = [
    # examples 质量门禁依赖：示例（不进 wheel）的 lint/pyright 需要可解析
    # 这些第三方库的类型；主包对它们零依赖（forbidden 契约强制）
    "aiosqlite>=0.19",
    "aioodbc>=0.5",
    "httpx>=0.27",
    "redis>=5",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.16",
    "import-linter>=2.0",
    "pyright>=1.1.380",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式收敛规则集（CI 确定性）：正确性（E4/E7/E9/F）+ import 排序（I）。
# 自愈式代码大量使用 except Exception 兜底并记录日志（BLE/S 系不适用）。
select = ["E4", "E7", "E9", "F", "I"]

[tool.importlinter]
root_packages = ["streamgate"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Pure core: no DB/Redis/HTTP-client code inside the package"
type = "forbidden"
source_modules = ["streamgate"]
forbidden_modules = [
    "sqlalchemy",
    "sqlmodel",
    "redis",
    "aiosqlite",
    "aioodbc",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Layered architecture (higher layers may import lower layers)"
type = "layers"
layers = [
    "streamgate.ingest | streamgate.consumer",
    "streamgate.specs | streamgate.transport | streamgate.resilience",
    "streamgate.protocols | streamgate.config | streamgate.obs",
]

[tool.pyright]
pythonVersion = "3.10"
include = ["src/streamgate"]
typeCheckingMode = "basic"
